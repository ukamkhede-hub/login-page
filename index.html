<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Umesh Login Page</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- Login Container -->

    <div class="login-container">


        <div class="login-box">


            <!-- Title -->

            <h1>LOGIN</h1>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- Username -->

                <div class="input-box">

                    <input
                        type="text"
                        id="username"
                        placeholder="Email"
                        required
                    >

                    <span>✉</span>

                </div>


                <!-- Password -->

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <span
                        class="password-icon"
                        onclick="togglePassword()">

                        👁

                    </span>

                </div>


                <!-- Forgot Password -->

                <div class="forgot">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Remember Me -->

                <div class="remember">

                    <label>

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Remember Me
                        </span>

                    </label>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>


                <!-- Message -->

                <p id="message"></p>


                <!-- Register -->

                <div class="register">

                    <span>
                        Don't have an Account?
                    </span>

                    <a href="#">
                        Register
                    </a>

                </div>


            </form>


        </div>


    </div>


    <!-- JavaScript -->

    <script>


        // Login Validation

        document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {


            event.preventDefault();


            let username =
                document
                .getElementById("username")
                .value;


            let password =
                document
                .getElementById("password")
                .value;


            // Correct Login

            if (
                username === "Umesh" &&
                password === "Umesh123"
            ) {


                document
                .getElementById("message")
                .innerHTML =
                "Login Successful! 🎉";


                document
                .getElementById("message")
                .style.color =
                "#00ff88";


                // Go to Dashboard

                setTimeout(function() {

                    window.location.href =
                    "dashboard.html";

                }, 500);


            }

            else {


                document
                .getElementById("message")
                .innerHTML =
                "Invalid Username or Password!";


                document
                .getElementById("message")
                .style.color =
                "#ff4d6d";


            }


        });



        // Show / Hide Password

        function togglePassword() {


            let password =
                document
                .getElementById("password");


            if (
                password.type === "password"
            ) {


                password.type =
                "text";


            }

            else {


                password.type =
                "password";


            }


        }


    </script>


</body>

</html>
