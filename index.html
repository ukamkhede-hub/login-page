<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Umesh Login Page</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <div class="circle circle1"></div>

        <div class="circle circle2"></div>

        <div class="circle circle3"></div>

    </div>


    <!-- Login Container -->

    <div class="login-container">

        <div class="login-box">

            <h1>LOGIN</h1>

            <p class="subtitle">
                Welcome Back! Please login to continue.
            </p>


            <!-- Login Form -->

            <form id="loginForm">

                <!-- Username -->

                <div class="input-box">

                    <input
                        type="text"
                        id="username"
                        placeholder="Username"
                        required
                    >

                    <span>👤</span>

                </div>


                <!-- Password -->

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <!-- Show / Hide Password -->

                    <span
                        class="password-icon"
                        onclick="togglePassword()">

                        👁️

                    </span>

                </div>


                <!-- Options -->

                <div class="options">

                    <label>

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember Me

                    </label>


                    <a
                        href="#"
                        onclick="forgotPassword()">

                        Forgot Password?

                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>


                <!-- Message -->

                <p id="message"></p>


                <!-- Register -->

                <div class="register">

                    <span>
                        Don't have an Account?
                    </span>

                    <a href="#">
                        Register
                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        // =========================
        // LOGIN VALIDATION
        // =========================

        document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let username =
                document
                .getElementById("username")
                .value;

            let password =
                document
                .getElementById("password")
                .value;


            // Correct Username & Password

            if (
                username === "Umesh" &&
                password === "Umesh123"
            ) {

                document
                .getElementById("message")
                .innerHTML =
                "✅ Login Successful! Welcome Umesh 🎉";

                document
                .getElementById("message")
                .style.color =
                "#00ff88";


                // Open Dashboard

                setTimeout(function() {

                    window.location.href =
                    "dashboard.html";

                }, 1000);


            } else {

                document
                .getElementById("message")
                .innerHTML =
                "❌ Invalid Username or Password!";

                document
                .getElementById("message")
                .style.color =
                "#ff4d6d";

            }

        });


        // =========================
        // SHOW / HIDE PASSWORD
        // =========================

        function togglePassword() {

            let password =
                document
                .getElementById("password");

            let icon =
                document
                .querySelector(".password-icon");


            if (
                password.type === "password"
            ) {

                password.type = "text";

                icon.innerHTML = "🙈";

            } else {

                password.type = "password";

                icon.innerHTML = "👁️";

            }

        }


        // =========================
        // FORGOT PASSWORD
        // =========================

        function forgotPassword() {

            let username =
                document
                .getElementById("username")
                .value;


            if (username === "") {

                alert(
                    "Please enter your username first."
                );

            } else {

                alert(
                    "Password reset link will be sent for: "
                    + username
                );

            }

        }

    </script>

</body>

</html>
