<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Umesh Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #74ebd5,
                #ACB6E5
            );
        }

        .dashboard {
            background: white;
            width: 450px;
            padding: 40px;

            text-align: center;

            border-radius: 15px;

            box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #007BFF;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
            font-size: 18px;
        }

        button {
            padding: 12px 30px;

            background-color: #007BFF;
            color: white;

            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-size: 16px;

            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>Welcome to the Umesh Project 🎉</h1>

        <p>
            Login Successful!
        </p>

        <button onclick="logout()">
            Logout
        </button>

    </div>
    <script>
    function logout() {
        window.location.href = "index.html";
    }
</script>
