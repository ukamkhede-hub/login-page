<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Umesh Project Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
    min-height: 100vh;

    background: linear-gradient(
        135deg,
        #667eea,
        #764ba2,
        #f093fb
    );
}

        /* Navigation Bar */

        nav {
            background: #007BFF;
            color: white;

            padding: 15px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav ul {
            list-style: none;

            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;

            font-size: 16px;
            cursor: pointer;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Main Content */

        .container {
            padding: 50px;
            text-align: center;
        }

        .container h1 {
    color: white;
    margin-bottom: 15px;
}

        .container p {
    color: white;
    font-size: 18px;
}

        /* Cards */

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;

            margin-top: 40px;

            flex-wrap: wrap;
        }

        .card {
            background: white;

            width: 250px;
            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 0 15px rgba(0,0,0,0.15);

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);

            box-shadow: 0 0 25px rgba(0,0,0,0.25);
        }

        .card h3 {
            color: #007BFF;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: #666;
        }

        /* Logout Button */

        .logout-btn {
            background: #dc3545;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;
        }

        .logout-btn:hover {
            background: #b02a37;
        }

        /* Responsive */

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                padding: 30px 15px;
            }

        }

    </style>
</head>

<body>

    <!-- Navigation Bar -->

    <nav>

        <h2>Umesh Project</h2>

        <ul>

            <li>
                <a href="#">Home</a>
            </li>

            <li>
                <a href="#profile">Profile</a>
            </li>

            <li>
                <a href="#about">About</a>
            </li>

            <li>
                <a href="#contact">Contact</a>
            </li>

            <li>
                <button class="logout-btn" onclick="logout()">
                    Logout
                </button>
            </li>

        </ul>

    </nav>


    <!-- Main Content -->

    <div class="container">

        <h1>Welcome to the Umesh Project 🎉</h1>

        <p>
            You have successfully logged in.
        </p>


        <!-- Cards -->

        <div class="cards">

            <div class="card" id="profile">

                <h3>👤 Profile</h3>

                <p>
                    Username: Umesh
                </p>

            </div>


            <div class="card" id="about">

                <h3>ℹ️ About</h3>

                <p>
                    This is my first Login and Dashboard project.
                </p>

            </div>


            <div class="card" id="contact">

                <h3>📞 Contact</h3>

                <p>
                    Email: umesh@example.com
                </p>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        function logout() {

            window.location.href = "index.html";

        }

    </script>

</body>
</html>
